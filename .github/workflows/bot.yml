name: Fashion Autoposter

on:
  schedule:
    # Каждые 10 минут с 10:00 до 23:50 МСК (07:00–20:50 UTC).
    # Минуты со сдвигом от :00/:30 — GitHub чаще пропускает запуски в пиковые минуты.
    # Плотное расписание = страховка от пропусков GitHub; внутренние гейты бота
    # (квота 5/день, интервал 2,5 ч, окно 10-23) не дадут запостить лишнее.
    - cron: "4,14,24,34,44,54 7-20 * * *"
  workflow_dispatch:  # ручной запуск из вкладки Actions

permissions:
  contents: write  # нужно, чтобы сохранять базу бота обратно в репозиторий

concurrency:
  group: fashion-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip  # кэш зависимостей → прогон ~1 минуту

      - run: pip install -r requirements.txt

      - name: Run one bot cycle
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -o pipefail
          python -m bot.main --once 2>&1 | tee data/last_run.log

      - name: Save bot state (SQLite) back to repo
        run: |
          git config user.name "fashion-bot"
          git config user.email "fashion-bot@users.noreply.github.com"
          git add data/bot.db data/last_run.log || true
          git diff --cached --quiet || git commit -m "chore: bot state [skip ci]"
          git pull --rebase origin main  # подтянуть чужие пуши, чтобы push не отклонили
          git push
